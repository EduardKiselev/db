# Redis Master Configuration

# Сетевые настройки
bind 0.0.0.0
port 6379
protected-mode no

# Персистентность - AOF
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Персистентность - RDB
save 900 1
save 300 10
save 60 10000

# Память и вытеснение
maxmemory 256mb
maxmemory-policy volatile-lru

# Защита от split-brain
min-replicas-to-write 1
min-replicas-max-lag 10

# Логирование
loglevel notice
logfile ""