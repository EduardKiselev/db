# Redis Sentinel Configuration

# Сетевые настройки
port 26379
protected-mode no

# Мониторинг мастера
sentinel monitor mymaster redis-master 6379 2

# Таймауты
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 10000
sentinel parallel-syncs mymaster 1

# Если parallel-syncs = 1:
#   → replica-2 синхронизируется (2-5 сек)
#   → Во время синхронизации replica-2 НЕ обслуживает чтение
#   → Но остальные реплики работают
# Если parallel-syncs = 2:
#   → Все реплики синхронизируются одновременно
#   → Во время синхронизации НИ ОДНА реплика не обслуживает чтение
#   → Приложение может получить ошибки чтения

# Разрешение хостнеймов (важно для Docker)
sentinel resolve-hostnames yes
sentinel announce-hostnames yes

# Логирование
loglevel notice
logfile ""